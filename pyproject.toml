[project]
name = "electronic-warfare-wargame"
version = "0.1.0"
description = "现代海空兵推软件原型：以电子战（EW）为核心，类似 Harpoon/CMO 的 2D 桌面推演工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyproj>=3.5",
    "shapely>=2.0",
    "PySide6>=6.5",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
